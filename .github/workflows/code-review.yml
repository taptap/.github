name: Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_call:
    # Reusable callers must pass PR context explicitly because `github.event.pull_request`
    # is not populated for `workflow_call` runs.
    inputs:
      pr_number:
        description: Pull request number to review when called as a reusable workflow.
        required: true
        type: number
      is_draft:
        description: Whether the pull request is still a draft when called as a reusable workflow.
        required: false
        default: false
        type: boolean
      head_repo_full_name:
        description: Head repository full name for same-repo validation.
        required: false
        type: string
      request_copilot_review:
        description: Whether to add @copilot as a PR reviewer. Set false to opt out per repository.
        required: false
        default: true
        type: boolean
      model:
        description: >-
          Full model ID for the review. Pinned rather than an alias (`opus`)
          because alias resolution lives in the bundled Claude Code build and
          drifts when that build is bumped — a silent model change under us.
          Aliases still work if a caller passes one explicitly.
        required: false
        type: string
        default: claude-opus-5[1m]
    secrets:
      # Both are optional so a caller can use either name; the gateway behind
      # `vars.ANTHROPIC_BASE_URL` may want an `x-api-key` (API_KEY) or a bearer
      # token (AUTH_TOKEN). Exactly one is required — the preflight step below
      # fails fast with a readable message when neither is passed, which is the
      # cost of dropping `required: true`.
      ANTHROPIC_API_KEY:
        required: false
      ANTHROPIC_AUTH_TOKEN:
        required: false

permissions:
  # `actions: read` keeps Actions metadata readable for the running job.
  actions: read
  # `contents: read` is required for checkout and for Claude to inspect repository files.
  contents: read
  # `id-token: write` is required because `claude-code-action` requests an OIDC token internally.
  id-token: write
  # `pull-requests: write` is required to request the Copilot reviewer and post inline review comments.
  pull-requests: write

concurrency:
  # Use the PR number when available so repeated reviews for the same PR cancel older runs
  # whether this workflow is triggered directly or via `workflow_call`.
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # Same `github.event_name` trap as the Copilot step below: a called workflow
    # sees the *caller's* event, so the old `event_name == 'workflow_call'` branch
    # was dead and `inputs.is_draft` / `inputs.head_repo_full_name` were never
    # read. Reusable callers happened to be safe only because they are all
    # triggered by `pull_request`, so the event payload carried the same facts.
    #
    # Now every clause is checked against whichever source is present, and a
    # missing source is vacuously true. Net effect for today's callers is
    # identical; a caller invoking this from a non-`pull_request` event is no
    # longer skipped outright, and its inputs are now honoured.
    if: >-
      (github.event.pull_request || inputs.pr_number) &&
      !github.event.pull_request.draft &&
      !inputs.is_draft &&
      (
        !github.event.pull_request.head.repo.full_name ||
        github.event.pull_request.head.repo.full_name == github.repository
      ) &&
      (
        !inputs.head_repo_full_name ||
        inputs.head_repo_full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request Copilot review
        # Copilot review is optional. Keep Claude review running if this request is unavailable.
        # Reusable callers can opt out per repository by passing `request_copilot_review: false`.
        # Direct `pull_request` runs (no inputs) keep requesting Copilot as before.
        #
        # `inputs.pr_number` — not `github.event_name` — is what tells us this is
        # a reusable call: in a called workflow `github.event_name` is the
        # *caller's* event (`pull_request`), never `'workflow_call'`, so the old
        # guard was always true and the opt-out silently did nothing.
        if: ${{ !inputs.pr_number || inputs.request_copilot_review }}
        continue-on-error: true
        run: |
          gh pr edit "$PR_NUMBER" -R "$REPO" --add-reviewer @copilot
        env:
          GH_TOKEN: ${{ github.token }}
          # Support both direct PR-triggered runs and reusable workflow callers.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO: ${{ github.repository }}

      - name: Check Anthropic credential is present
        env:
          ANTHROPIC_CREDENTIAL: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_CREDENTIAL" ]; then
            echo "::error::No Anthropic credential. Pass ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN in the caller's \`secrets:\` block (or use \`secrets: inherit\`)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Keep enough history for `git log` and `git blame` without cloning everything.
          fetch-depth: 100

      - uses: anthropics/claude-code-action@e69ec4d5e5868930cecb8da7360a51fa9c4de5d6 # v1
        with:
          # Name-level fallback only: whichever secret the caller supplied wins.
          # This is NOT a retry-on-auth-failure — Actions cannot re-run a failed
          # step with a different credential without duplicating the whole review.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_AUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

            You are a senior code reviewer. The goal is to surface real, actionable issues — not noise.

            ## Step 1: Reconcile previous review comments

            Before reviewing anything new, handle your prior comments on this PR so issues are not reported twice across commits.

            1. Fetch your previous inline comments:
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || inputs.pr_number }}/comments --jq '[.[] | select(.user.login == "claude[bot]")]'`
            2. Fetch the current diff: `gh pr diff ${{ github.event.pull_request.number || inputs.pr_number }}`
            3. For each previous comment, read the **current** version of the file and check whether the issue is fixed:
               - **Fixed**: reply with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number || inputs.pr_number }}/comments/{comment_id}/replies -f body="✅ Fixed. {brief description of the fix}"`, then resolve the thread (step 5).
               - **Still present**: reply explaining it is still unresolved. **Do NOT open a new inline comment for the same issue.**
               - **Partially fixed**: reply describing what remains.
            4. Only open new inline comments for **genuinely new issues** not covered by any previous comment.
            5. After replying to fixed comments, resolve their threads:
               a. Get review thread IDs:
                  `gh api graphql -f query='{ repository(owner:"${{ github.repository_owner }}", name:"${{ github.event.repository.name }}") { pullRequest(number:${{ github.event.pull_request.number || inputs.pr_number }}) { reviewThreads(first:100) { nodes { id isResolved comments(first:1) { nodes { databaseId body } } } } } } }'`
               b. Match each fixed comment's databaseId to its thread node ID.
               c. Resolve: `gh api graphql -f query='mutation { resolveReviewThread(input:{threadId:"THREAD_NODE_ID"}) { thread { isResolved } } }'`

            ## Step 2: Review the new changes

            Analyze the diff in the context of the full codebase. For each changed file, read the **full source** (not just the diff hunk) to understand context. Use `git blame` / `git log` on suspicious lines to understand history. Follow the guidelines in REVIEW.md if present.

            ## Confidence and severity

            Score every finding 0-100. Only report findings with confidence ≥ 75.
            - 90-100: certain bug or security issue
            - 75-89: highly confident, very likely a real problem
            - <75: do not report

            Use severity levels: P1 (blocking / high-risk), P2 (meaningful), P3 (minor).

            ## False-positive filters — do NOT report

            - Issues that already existed before this PR
            - Style preferences or nits that a linter/formatter handles
            - Missing comments on self-explanatory code
            - Hypothetical future problems
            - Code that "could be better" but works correctly
            - Generated files, lockfiles, vendored code

            ## Step 3: Output

            - Post findings as inline review comments via `mcp__github_inline_comment__create_inline_comment`.
            - Keep the review concise: at most 10 new findings.
            - After all inline comments are posted, publish ONE summary comment via `gh pr comment ${{ github.event.pull_request.number || inputs.pr_number }} --body "..."`. Format:
              - One-line verdict: ✅ Approved / ⚠️ Issues Found / 🔴 Changes Requested
              - If any prior comments were resolved this run: "N previously reported issues fixed."
              - List of new findings with severity (🔴 P1 / 🟡 P2 / 🟢 P3) and confidence.
              - Brief overall assessment.
          # Tool surface: inline comments + read-only PR inspection + scoped gh api (PR comments + GraphQL only) + gh pr comment for summary.
          claude_args: |
            --model '${{ inputs.model || 'claude-opus-5[1m]' }}'
            --max-turns 256
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh api repos/*/pulls/*/comments*),Bash(gh api graphql*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*)"
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
